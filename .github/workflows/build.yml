name: Build OEK Client JAR

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build the Fabric JAR
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload playable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: OEK-Client-0.2.0-Fabric-1.21.11
          path: |
            build/libs/oek-client-0.2.0.jar
          if-no-files-found: error
          retention-days: 30
